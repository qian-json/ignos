    <script>
      // Written with AI assistance (Claude Code). Set before first paint so the headline is never
      // painted and then hidden: the flame-front entrance, or none when the system asks for less motion.
      (function () {
        var d = document.documentElement, m = "front";
        try { if (matchMedia("(prefers-reduced-motion: reduce)").matches) m = "still"; } catch (e) {}
        d.dataset.intro = m;
        // any input jumps to the end state
        var done = function () { d.classList.add("intro-done"); };
        ["wheel", "keydown", "pointerdown", "touchstart"].forEach(function (e) { addEventListener(e, done, { passive: true, once: true }); });
        // and once it has played, so the line masks (and the glow they would clip) are gone
        setTimeout(done, 1700);
      })();
    </script>
